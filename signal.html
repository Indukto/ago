<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0000ff" />
    <meta
      name="description"
      content="Ein dynamisches, animiertes Signalbild der Funkstation & Smart City Lindau, das den gesamten Bildschirm ausfüllt."
    />
    <title>Signalbild — Funkstation &amp; Smart City Lindau</title>
    <link rel="icon" type="image/svg+xml" href="logoblue.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/landing/landing.css?v=12" />
    <link rel="stylesheet" href="assets/landing/signal.css?v=3" />
    <script src="assets/landing/signal.js?v=3" defer></script>
  </head>
  <body class="page-signal">
    <a class="skip-link" href="#main">Zum Inhalt springen</a>
    <main id="main" class="signal-page shell">
      <h1 class="signal-title">Unsichtbare Wellen. Sichtbare Zeichen.</h1>

      <figure class="signal-figure">
        <div class="signal-stage">
          <canvas
            class="signal-canvas"
            data-signal-canvas
            role="img"
            aria-label="Animiertes blau-weißes Raster aus Kreuzen, Gittern und Rauten, das sechs geformte Bänder über die gesamte Bildschirmfläche bildet."
          >
            Animiertes Signalbild über die gesamte Bildschirmfläche.
          </canvas>
        </div>
        <figcaption class="signal-caption">
          <a class="signal-home" href="landing.html">Zur Startseite</a>
          <span class="signal-settings">
            Variation 3827&nbsp;&nbsp;/&nbsp;&nbsp;Flexible Fläche&nbsp;&nbsp;/&nbsp;&nbsp;Cells 88&nbsp;&nbsp;/&nbsp;&nbsp;Bands 6&nbsp;&nbsp;/&nbsp;&nbsp;Figure&nbsp;&nbsp;/&nbsp;&nbsp;Wave 45 %&nbsp;&nbsp;/&nbsp;&nbsp;Tilt −69 %&nbsp;&nbsp;/&nbsp;&nbsp;Detail 63 %&nbsp;&nbsp;/&nbsp;&nbsp;Size 79 %&nbsp;&nbsp;/&nbsp;&nbsp;Amount 0,60&nbsp;&nbsp;/&nbsp;&nbsp;12 fps&nbsp;&nbsp;/&nbsp;&nbsp;36 Frames&nbsp;&nbsp;/&nbsp;&nbsp;2 Inks
          </span>
          <div class="signal-controls">
            <button class="btn btn--ghost signal-copy" type="button" data-copy-variation>Variation kopieren</button>
            <button class="btn btn--solid signal-toggle" type="button" data-signal-toggle aria-pressed="true">
              Animation pausieren
            </button>
          </div>
        </figcaption>
      </figure>

      <p class="signal-404" aria-label="404">404</p>
      <p class="signal-status" data-signal-status role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
